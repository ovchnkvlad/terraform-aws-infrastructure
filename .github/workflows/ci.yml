---
name: Terraform CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Format, lint, and validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Check Terraform formatting
        run: >-
          docker run --rm
          --volume "$PWD:/workspace:ro"
          --workdir /workspace
          hashicorp/terraform:1.17.1
          fmt -check -recursive

      - name: Initialize providers without a backend
        run: >-
          docker run --rm
          --volume "$PWD:/workspace"
          --workdir /workspace
          hashicorp/terraform:1.17.1
          init -backend=false -input=false -lockfile=readonly

      - name: Validate configuration
        run: >-
          docker run --rm
          --volume "$PWD:/workspace:ro"
          --workdir /workspace
          hashicorp/terraform:1.17.1
          validate

      - name: Run native Terraform tests
        run: >-
          docker run --rm
          --volume "$PWD:/workspace:ro"
          --workdir /workspace
          hashicorp/terraform:1.17.1
          test

      - name: Run TFLint
        run: >-
          docker run --rm
          --volume "$PWD:/workspace:ro"
          ghcr.io/terraform-linters/tflint:v0.64.0
          --chdir=/workspace --recursive

  security:
    name: Security policy checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan Terraform configuration
        run: >-
          docker run --rm
          --volume "$PWD:/workspace:ro"
          aquasec/trivy:0.76.2
          config --exit-code 1 --severity HIGH,CRITICAL /workspace

      - name: Scan Git history for secrets
        run: >-
          docker run --rm
          --volume "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          detect --source=/repo --redact
